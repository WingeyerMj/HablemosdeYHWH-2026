<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" rx="28" fill="url(#bg)"/>
  
  <!-- Subtle Pattern Circles -->
  <circle cx="50" cy="50" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="550" cy="400" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Illustration Box -->
  <g transform="translate(300, 210)">
    
        <!-- Desert Ground -->
        <ellipse cx="0" cy="90" rx="170" ry="35" fill="#fef3c7"/>

        <!-- Large Open Tent of Abraham (open 4 sides) -->
        <polygon points="-120,70 0,-40 120,70" fill="#fef3c7" stroke="#92400e" stroke-width="6"/>
        <polygon points="-60,70 0,-20 60,70" fill="#451a03"/>

        <!-- Table with bread and water jug -->
        <rect x="-30" y="55" width="60" height="20" rx="4" fill="#d97706"/>
        <!-- Water pitcher -->
        <path d="M -15 45 C -25 45 -25 60 -15 60 Z" fill="#38bdf8"/>
        <!-- 3 Bread loaves -->
        <circle cx="0" cy="52" r="7" fill="#fde047"/>
        <circle cx="12" cy="52" r="7" fill="#fde047"/>

        <!-- Oak Tree of Mamre -->
        <rect x="110" y="20" width="16" height="60" fill="#78350f"/>
        <circle cx="118" cy="0" r="38" fill="#16a34a"/>
        <circle cx="95" cy="5" r="28" fill="#22c55e"/>
        <circle cx="135" cy="10" r="26" fill="#15803d"/>
        
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 395)" filter="url(#shadow)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#ffffff" opacity="0.96"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e1b4b">
      La Carpa Abierta de la Hospitalidad
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="David, serif" font-weight="bold" font-size="18" fill="#7c3aed">
      וַיֵּרָא
    </text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(45, 45)">
    <rect width="130" height="36" rx="18" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <text x="65" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4338ca">
      ⛺ Semillas
    </text>
  </g>
</svg>