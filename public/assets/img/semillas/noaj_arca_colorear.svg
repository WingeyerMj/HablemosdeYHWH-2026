<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" rx="28" fill="url(#bg)"/>
  
  <!-- Subtle Pattern Circles -->
  <circle cx="50" cy="50" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="550" cy="400" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Illustration Box -->
  <g transform="translate(300, 210)">
    
        <!-- Rainbow 7 colors -->
        <ellipse cx="0" cy="50" rx="170" ry="150" fill="none" stroke="#ef4444" stroke-width="8"/>
        <ellipse cx="0" cy="50" rx="162" ry="142" fill="none" stroke="#f97316" stroke-width="8"/>
        <ellipse cx="0" cy="50" rx="154" ry="134" fill="none" stroke="#eab308" stroke-width="8"/>
        <ellipse cx="0" cy="50" rx="146" ry="126" fill="none" stroke="#22c55e" stroke-width="8"/>
        <ellipse cx="0" cy="50" rx="138" ry="118" fill="none" stroke="#06b6d4" stroke-width="8"/>
        <ellipse cx="0" cy="50" rx="130" ry="110" fill="none" stroke="#3b82f6" stroke-width="8"/>
        <ellipse cx="0" cy="50" rx="122" ry="102" fill="none" stroke="#8b5cf6" stroke-width="8"/>

        <!-- Dove with olive branch -->
        <text x="90" y="-70" font-size="40">🕊️</text>

        <!-- Water waves -->
        <ellipse cx="0" cy="80" rx="170" ry="35" fill="#38bdf8" opacity="0.8"/>
        <ellipse cx="0" cy="95" rx="180" ry="30" fill="#0284c7"/>

        <!-- Noah Ark -->
        <path d="M -110 50 L -80 85 L 80 85 L 110 50 Z" fill="#78350f" stroke="#451a03" stroke-width="4"/>
        <rect x="-60" y="10" width="120" height="42" fill="#b45309" stroke="#78350f" stroke-width="4"/>
        <!-- Roof -->
        <polygon points="-75,10 0,-20 75,10" fill="#92400e"/>
        <!-- Ark Windows -->
        <rect x="-40" y="22" width="16" height="16" rx="3" fill="#fef08a"/>
        <rect x="-8" y="22" width="16" height="16" rx="3" fill="#fef08a"/>
        <rect x="24" y="22" width="16" height="16" rx="3" fill="#fef08a"/>
        
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 395)" filter="url(#shadow)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#ffffff" opacity="0.96"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e1b4b">
      El Arca de Salvación y el Arcoíris
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="David, serif" font-weight="bold" font-size="18" fill="#7c3aed">
      נֹחַ - הַתֵּבָה
    </text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(45, 45)">
    <rect width="130" height="36" rx="18" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <text x="65" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4338ca">
      🌈 Semillas
    </text>
  </g>
</svg>