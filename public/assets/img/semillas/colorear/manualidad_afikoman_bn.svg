<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">JAG HAMATZOT: BOLSITA PARA EL AFIKOMÁN</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">חַג הַמַּצּוֹת  •  Molde decorativo para imprimir, colorear y armar</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <rect x="-125" y="-110" width="250" height="240" rx="18" stroke-width="4.5"/>
      <polygon points="-125,-110 0,-30 125,-110" stroke-width="4"/>
      <rect x="-90" y="15" width="180" height="80" rx="12" stroke-width="3" stroke-dasharray="6 4"/>
      <text x="0" y="62" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827" stroke="none">אפיקומן • AFIKOMÁN</text>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Siete días comeréis panes sin levadura.” (Éxodo 12:15)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
