<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">SHABAT KADOSH: JALÁ Y VELITAS DE SHABAT</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">שַׁבָּת שָׁלוֹם  •  Molde y lámina para colorear en familia</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Dos candelabros y velas -->
      <rect x="-220" y="40" width="50" height="24" rx="5" stroke-width="3.5"/>
      <rect x="-208" y="-55" width="26" height="95" rx="4" stroke-width="3.5"/>
      <path d="M -195 -55 Q -210 -80 -195 -105 Q -180 -80 -195 -55 Z" stroke-width="3"/>
      <rect x="170" y="40" width="50" height="24" rx="5" stroke-width="3.5"/>
      <rect x="182" y="-55" width="26" height="95" rx="4" stroke-width="3.5"/>
      <path d="M 195 -55 Q 180 -80 195 -105 Q 210 -80 195 -55 Z" stroke-width="3"/>
      <!-- Pan trenzado (Jalá) en el centro -->
      <ellipse cx="0" cy="40" rx="125" ry="52" stroke-width="4.5"/>
      <path d="M -90 25 Q -45 -10 0 25 Q 45 -10 90 25" fill="none" stroke-width="3.5"/>
      <path d="M -85 52 Q -40 20 0 52 Q 40 20 85 52" fill="none" stroke-width="3.5"/>
      <!-- Copa de Kidush -->
      <path d="M -30 -105 L 30 -105 L 18 -55 L -18 -55 Z" stroke-width="3.5"/>
      <line x1="0" y1="-55" x2="0" y2="-22" stroke-width="4"/>
      <ellipse cx="0" cy="-20" rx="26" ry="8" stroke-width="3.5"/>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Acuérdate del día del Shabat para santificarlo.” (Éxodo 20:8)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
