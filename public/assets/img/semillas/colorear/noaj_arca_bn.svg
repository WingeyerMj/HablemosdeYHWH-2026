<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">PARASHÁ NÓAJ: EL ARCA Y EL ARCOÍRIS DEL PACTO</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">נֹחַ • הַתֵּבָה  •  Colorea los 7 colores del arcoíris</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- 7 arcos del Arcoíris en blanco para colorear -->
      <path d="M -260 80 A 260 220 0 0 1 260 80" fill="none" stroke-width="3"/>
      <path d="M -242 80 A 242 202 0 0 1 242 80" fill="none" stroke-width="3"/>
      <path d="M -224 80 A 224 184 0 0 1 224 80" fill="none" stroke-width="3"/>
      <path d="M -206 80 A 206 166 0 0 1 206 80" fill="none" stroke-width="3"/>
      <path d="M -188 80 A 188 148 0 0 1 188 80" fill="none" stroke-width="3"/>
      <path d="M -170 80 A 170 130 0 0 1 170 80" fill="none" stroke-width="3"/>
      <path d="M -152 80 A 152 112 0 0 1 152 80" fill="none" stroke-width="3"/>
      <path d="M -134 80 A 134 94 0 0 1 134 80" fill="none" stroke-width="3"/>
      <!-- Nubes a los lados -->
      <path d="M -290 95 Q -290 65 -260 65 Q -240 45 -210 60 Q -185 60 -185 85 Q -170 95 -190 108 L -275 108 Z" fill="#ffffff" stroke-width="3.5"/>
      <path d="M 185 95 Q 185 65 215 65 Q 235 45 265 60 Q 290 60 290 85 Q 305 95 285 108 L 195 108 Z" fill="#ffffff" stroke-width="3.5"/>
      <!-- Paloma con ramita de olivo -->
      <g transform="translate(130, -105)">
        <path d="M -20 10 Q 0 -15 28 -2 Q 40 -12 52 -4 Q 44 10 26 12 Q 8 28 -20 10 Z" fill="#ffffff" stroke-width="3"/>
        <path d="M -2 0 Q -25 -28 -45 -18 Q -30 4 -2 0 Z" fill="#ffffff" stroke-width="3"/>
        <line x1="50" y1="0" x2="72" y2="-8" stroke-width="2.5"/>
        <ellipse cx="64" cy="-8" rx="6" ry="3" stroke-width="2"/>
      </g>
      <!-- Arca de Noé -->
      <path d="M -155 55 L -115 125 L 115 125 L 155 55 Z" fill="#ffffff" stroke-width="4.5"/>
      <line x1="-138" y1="85" x2="138" y2="85" stroke-width="2.5"/>
      <line x1="-126" y1="105" x2="126" y2="105" stroke-width="2.5"/>
      <rect x="-95" y="-12" width="190" height="67" fill="#ffffff" stroke-width="4"/>
      <polygon points="-115,-12 0,-56 115,-12" fill="#ffffff" stroke-width="4.5"/>
      <!-- Ventanas del Arca -->
      <rect x="-65" y="6" width="28" height="28" rx="4" stroke-width="3"/>
      <rect x="-14" y="6" width="28" height="28" rx="4" stroke-width="3"/>
      <rect x="37" y="6" width="28" height="28" rx="4" stroke-width="3"/>
      <!-- Olas del agua -->
      <path d="M -310 138 Q -270 115 -230 138 Q -190 160 -150 138 Q -110 115 -70 138 Q -30 160 10 138 Q 50 115 90 138 Q 130 160 170 138 Q 210 115 250 138 Q 290 160 315 138" fill="none" stroke-width="4"/>
      <path d="M -310 165 Q -270 145 -230 165 Q -190 185 -150 165 Q -110 145 -70 165 Q -30 185 10 165 Q 50 145 90 165 Q 130 185 170 165 Q 210 145 250 165 Q 290 185 315 165" fill="none" stroke-width="3.5"/>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Mi arco he puesto en las nubes, el cual será por señal del pacto entre Mí y la tierra.” (Génesis 9:13)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
