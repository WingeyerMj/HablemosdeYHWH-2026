<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">PARASHÁ BERESHIT: LOS 7 DÍAS DE LA CREACIÓN</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">בְּרֵאשִׁית  •  Colorea cada día y el Shabat</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Globo de la Tierra en el centro -->
      <circle cx="0" cy="-20" r="105" fill="#ffffff" stroke-width="4.5"/>
      <!-- Continentes en contorno -->
      <path d="M -68 -55 Q -25 -90 25 -68 Q 65 -42 35 -5 Q -5 25 -45 8 Q -80 -18 -68 -55 Z" fill="#ffffff" stroke-width="3"/>
      <path d="M -25 22 Q 25 38 55 68 Q -15 80 -48 56 Z" fill="#ffffff" stroke-width="3"/>
      <!-- Sol a la derecha (Día 4) -->
      <circle cx="175" cy="-115" r="38" fill="#ffffff" stroke-width="3.5"/>
      <line x1="175" y1="-172" x2="175" y2="-160" stroke-width="3.5"/>
      <line x1="175" y1="-70" x2="175" y2="-58" stroke-width="3.5"/>
      <line x1="118" y1="-115" x2="130" y2="-115" stroke-width="3.5"/>
      <line x1="220" y1="-115" x2="232" y2="-115" stroke-width="3.5"/>
      <line x1="135" y1="-155" x2="144" y2="-146" stroke-width="3.5"/>
      <line x1="206" y1="-84" x2="215" y2="-75" stroke-width="3.5"/>
      <line x1="215" y1="-155" x2="206" y2="-146" stroke-width="3.5"/>
      <line x1="144" y1="-84" x2="135" y2="-75" stroke-width="3.5"/>
      <!-- Luna y estrellas a la izquierda (Día 4) -->
      <path d="M -165 -140 A 38 38 0 1 0 -135 -80 A 28 28 0 1 1 -165 -140 Z" fill="#ffffff" stroke-width="3.5"/>
      <polygon points="-230,-115 -224,-102 -210,-102 -221,-93 -217,-80 -230,-88 -243,-80 -239,-93 -250,-102 -236,-102" fill="#ffffff" stroke-width="2.5"/>
      <polygon points="-110,-145 -106,-136 -96,-136 -104,-130 -101,-120 -110,-126 -119,-120 -116,-130 -124,-136 -114,-136" fill="#ffffff" stroke-width="2.5"/>
      <!-- Nubes / Cielo (Día 2) -->
      <path d="M -270 -20 Q -270 -45 -245 -45 Q -230 -60 -205 -50 Q -185 -50 -185 -30 Q -170 -20 -185 -8 L -260 -8 Q -275 -8 -270 -20 Z" fill="#ffffff" stroke-width="3"/>
      <!-- Pez y ave (Día 5) -->
      <path d="M 165 20 Q 195 0 225 20 Q 195 40 165 20 M 225 20 L 245 8 L 245 32 Z" fill="#ffffff" stroke-width="3"/>
      <circle cx="180" cy="17" r="2.5" fill="#111827"/>
      <path d="M 185 -35 Q 202 -50 218 -35 Q 235 -50 252 -35" fill="none" stroke-width="3"/>
      <!-- 7 círculos de los días para colorear -->
      <g transform="translate(0, 145)">
        <circle cx="-270" cy="0" r="34" stroke-width="3.5"/><text x="-270" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827" stroke="none">Día 1</text>
        <circle cx="-180" cy="0" r="34" stroke-width="3.5"/><text x="-180" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827" stroke="none">Día 2</text>
        <circle cx="-90" cy="0" r="34" stroke-width="3.5"/><text x="-90" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827" stroke="none">Día 3</text>
        <circle cx="0" cy="0" r="34" stroke-width="3.5"/><text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827" stroke="none">Día 4</text>
        <circle cx="90" cy="0" r="34" stroke-width="3.5"/><text x="90" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827" stroke="none">Día 5</text>
        <circle cx="180" cy="0" r="34" stroke-width="3.5"/><text x="180" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827" stroke="none">Día 6</text>
        <circle cx="270" cy="0" r="38" stroke-width="4.5" stroke-dasharray="6 3"/><text x="270" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827" stroke="none">SHABAT</text>
      </g>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“En el principio creó Elohim los cielos y la tierra... y reposó en el séptimo día.” (Génesis 1-2)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
