<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">PARASHÁ VAYIRÁ: LA CARPA DE LA HOSPITALIDAD</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">וַיֵּרָא  •  Colorea la tienda abierta y la encina de Mamre</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Suelo y camino -->
      <ellipse cx="0" cy="140" rx="300" ry="38" fill="#ffffff" stroke-width="3.5"/>
      <!-- Gran carpa abierta de Abraham -->
      <polygon points="-210,125 -20,-95 170,125" fill="#ffffff" stroke-width="4.5"/>
      <polygon points="-105,125 -20,-55 65,125" fill="#ffffff" stroke-width="4"/>
      <line x1="-20" y1="-95" x2="-20" y2="-125" stroke-width="4"/>
      <!-- Mesa servida con pan y jarra de agua -->
      <rect x="-70" y="75" width="100" height="18" rx="4" fill="#ffffff" stroke-width="3.5"/>
      <line x1="-55" y1="93" x2="-55" y2="128" stroke-width="4"/>
      <line x1="15" y1="93" x2="15" y2="128" stroke-width="4"/>
      <!-- Panes y jarra -->
      <path d="M -48 75 C -58 55 -30 48 -30 75 Z" fill="#ffffff" stroke-width="3"/>
      <ellipse cx="-10" cy="68" rx="12" ry="8" fill="#ffffff" stroke-width="3"/>
      <ellipse cx="14" cy="68" rx="12" ry="8" fill="#ffffff" stroke-width="3"/>
      <!-- Encina / Árbol de Mamre a la derecha -->
      <rect x="200" y="10" width="26" height="115" fill="#ffffff" stroke-width="3.5"/>
      <circle cx="213" cy="-25" r="55" fill="#ffffff" stroke-width="3.5"/>
      <circle cx="172" cy="-5" r="40" fill="#ffffff" stroke-width="3.5"/>
      <circle cx="252" cy="-5" r="40" fill="#ffffff" stroke-width="3.5"/>
      <!-- Sol arriba -->
      <circle cx="-250" cy="-120" r="32" fill="#ffffff" stroke-width="3.5"/>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Estaba sentado a la puerta de su tienda en el calor del día... recibiendo con amor.” (Génesis 18:1-8)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
