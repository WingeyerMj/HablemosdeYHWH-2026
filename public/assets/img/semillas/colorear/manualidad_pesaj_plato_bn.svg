<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">PÉSAJ: BANDEJA DIDÁCTICA DEL SÉDER</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">פֶּסַח • הַסֵּדֶר  •  Colorea y recorta los elementos del plato de Pésaj</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <circle cx="0" cy="5" r="168" stroke-width="4.5"/>
      <circle cx="0" cy="5" r="145" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="0" cy="-82" r="36" stroke-width="3"/><text x="0" y="-78" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827" stroke="none">MATZÁ</text>
      <circle cx="88" cy="-35" r="36" stroke-width="3"/><text x="88" y="-31" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827" stroke="none">MAROR</text>
      <circle cx="88" cy="55" r="36" stroke-width="3"/><text x="88" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827" stroke="none">JORÓSET</text>
      <circle cx="0" cy="95" r="36" stroke-width="3"/><text x="0" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827" stroke="none">KARPAS</text>
      <circle cx="-88" cy="55" r="36" stroke-width="3"/><text x="-88" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827" stroke="none">ZEROA</text>
      <circle cx="-88" cy="-35" r="36" stroke-width="3"/><text x="-88" y="-31" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827" stroke="none">COPA</text>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Y este día os será en memoria, y lo celebraréis como fiesta solemne para YHWH.” (Éxodo 12:14)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
