<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">SHAVUOT: LAS DOS TABLAS DE LA TORÁH</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">שָׁבוּעוֹת  •  Molde para colorear y decorar con flores</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <path d="M -175 130 L -175 -75 A 75 65 0 0 1 -25 -75 L -25 130 Z" stroke-width="4.5"/>
      <path d="M 25 130 L 25 -75 A 75 65 0 0 1 175 -75 L 175 130 Z" stroke-width="4.5"/>
      <line x1="-145" y1="-55" x2="-55" y2="-55" stroke-width="3"/><line x1="55" y1="-55" x2="145" y2="-55" stroke-width="3"/><text x="-160" y="-50" font-size="14" fill="#111827" stroke="none">1</text><text x="40" y="-50" font-size="14" fill="#111827" stroke="none">6</text>
      <line x1="-145" y1="-15" x2="-55" y2="-15" stroke-width="3"/><line x1="55" y1="-15" x2="145" y2="-15" stroke-width="3"/><text x="-160" y="-10" font-size="14" fill="#111827" stroke="none">2</text><text x="40" y="-10" font-size="14" fill="#111827" stroke="none">7</text>
      <line x1="-145" y1="25" x2="-55" y2="25" stroke-width="3"/><line x1="55" y1="25" x2="145" y2="25" stroke-width="3"/><text x="-160" y="30" font-size="14" fill="#111827" stroke="none">3</text><text x="40" y="30" font-size="14" fill="#111827" stroke="none">8</text>
      <line x1="-145" y1="65" x2="-55" y2="65" stroke-width="3"/><line x1="55" y1="65" x2="145" y2="65" stroke-width="3"/><text x="-160" y="70" font-size="14" fill="#111827" stroke="none">4</text><text x="40" y="70" font-size="14" fill="#111827" stroke="none">9</text>
      <line x1="-145" y1="105" x2="-55" y2="105" stroke-width="3"/><line x1="55" y1="105" x2="145" y2="105" stroke-width="3"/><text x="-160" y="110" font-size="14" fill="#111827" stroke="none">5</text><text x="40" y="110" font-size="14" fill="#111827" stroke="none">10</text>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Y dio a Moisés dos tablas del testimonio, tablas de piedra escritas con el dedo de Elohim.” (Éxodo 31:18)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
