<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">YOM TERUÁH: SHOFAR PARA COLOREAR Y ARMAR</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">יוֹם תְּרוּעָה • שׁוֹפָר  •  Día de Aclamación y Sonido del Shofar</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <path d="M -210 35 C -120 45 -50 100 35 65 C 125 30 165 -55 215 -115 C 195 -40 165 85 45 120 C -55 150 -135 85 -210 55 Z" stroke-width="4.5"/>
      <ellipse cx="205" cy="-95" rx="18" ry="38" transform="rotate(-25 205 -95)" stroke-width="3.5"/>
      <!-- Ondas de sonido -->
      <path d="M 245 -115 Q 268 -95 245 -70" fill="none" stroke-width="3.5"/>
      <path d="M 268 -132 Q 300 -95 268 -55" fill="none" stroke-width="3.5"/>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Alabadle a son de bocina (shofar)... ¡Aleluya!” (Salmo 150:3)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
