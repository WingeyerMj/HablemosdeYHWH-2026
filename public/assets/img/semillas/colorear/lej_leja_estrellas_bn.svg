<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Fondo completamente blanco listo para imprimir y colorear -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Marco decorativo para colorear -->
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <rect x="28" y="28" width="744" height="544" rx="16" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Encabezado -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#ffffff" stroke="#111827" stroke-width="1.4" letter-spacing="0.5">PARASHÁ LÉJ LEJÁ: LAS ESTRELLAS Y LA PROMESA</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#111827">לֶךְ־לְךָ  •  Cuenta y colorea las estrellas del cielo</text>
  </g>
  <line x1="60" y1="106" x2="740" y2="106" stroke="#111827" stroke-width="2"/>

  <!-- Ilustración principal en blanco y negro (trazos limpios para colorear) -->
  <g transform="translate(400, 315)" fill="#ffffff" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Dunas del desierto -->
      <path d="M -330 155 Q -140 85 50 145 Q 210 190 330 135 L 330 185 L -330 185 Z" fill="#ffffff" stroke-width="3.5"/>
      <!-- Carpa en el desierto -->
      <polygon points="-130,130 -35,5 60,130" fill="#ffffff" stroke-width="4.5"/>
      <polygon points="-35,5 60,130 105,130 10,12" fill="#ffffff" stroke-width="4"/>
      <path d="M -55 130 Q -35 65 -15 130 Z" fill="#ffffff" stroke-width="3.5"/>
      <!-- Grandes estrellas para colorear -->
      <g transform="translate(-240,-110) scale(1.1)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(-145,-145) scale(0.9)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(-20,-135) scale(1.25)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(105,-145) scale(1)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(225,-110) scale(1.15)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(-200,-35) scale(0.85)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(-90,-70) scale(0.95)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(45,-60) scale(0.85)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(175,-45) scale(1.05)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <g transform="translate(270,-30) scale(0.8)"><polygon points="0,-28 8,-9 28,-9 12,4 18,24 0,12 -18,24 -12,4 -28,-9 -8,-9" fill="#ffffff" stroke-width="3"/></g>
      <!-- Silueta de Abraham mirando al cielo -->
      <circle cx="-195" cy="70" r="18" fill="#ffffff" stroke-width="3.5"/>
      <path d="M -215 142 L -208 90 Q -195 85 -182 90 L -175 142 Z" fill="#ffffff" stroke-width="3.5"/>
    
  </g>

  <!-- Pie educativo para niños -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827">“Mira ahora los cielos, y cuenta las estrellas... Así será tu descendencia.” (Génesis 15:5)</text>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#374151">Ministerio Infantil Semillas de Toráh • Hablemos de YHWH • Lámina para Colorear</text>
</svg>
