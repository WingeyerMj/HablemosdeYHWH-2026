<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/><stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" rx="28" fill="url(#bg)"/>
  
  <!-- Subtle Pattern Circles -->
  <circle cx="50" cy="50" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="550" cy="400" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Illustration Box -->
  <g transform="translate(300, 210)">
    
        <!-- Matzah Pouch Fabric -->
        <rect x="-120" y="-80" width="240" height="170" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="6"/>
        
        <!-- Matzah Peeking out -->
        <rect x="-90" y="-120" width="180" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
        <!-- Matzah dots / stripes -->
        <circle cx="-60" cy="-95" r="3" fill="#b45309"/>
        <circle cx="-30" cy="-95" r="3" fill="#b45309"/>
        <circle cx="0" cy="-95" r="3" fill="#b45309"/>
        <circle cx="30" cy="-95" r="3" fill="#b45309"/>
        <circle cx="60" cy="-95" r="3" fill="#b45309"/>

        <!-- Embroidered Frame & Hebrew Lettering -->
        <rect x="-100" y="-60" width="200" height="130" rx="12" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="8 6"/>
        <text x="0" y="0" text-anchor="middle" font-family="David, serif" font-weight="bold" font-size="38" fill="#7e22ce">
          אֲפִיקוֹמָן
        </text>
        <text x="0" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#9333ea">
          AFIKOMÁN
        </text>

        <!-- Golden cord with tassel -->
        <path d="M 120 -40 Q 150 10 120 60" stroke="#f59e0b" stroke-width="6" fill="none"/>
        <circle cx="120" cy="65" r="8" fill="#d97706"/>
        
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 395)" filter="url(#shadow)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#ffffff" opacity="0.96"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e1b4b">
      Bolsita Especial para el Afikomán
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="David, serif" font-weight="bold" font-size="18" fill="#7c3aed">
      חַג הַמַּצּוֹת
    </text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(45, 45)">
    <rect width="130" height="36" rx="18" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <text x="65" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4338ca">
      🫓 Semillas
    </text>
  </g>
</svg>