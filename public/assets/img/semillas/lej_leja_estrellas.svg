<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" rx="28" fill="url(#bg)"/>
  
  <!-- Subtle Pattern Circles -->
  <circle cx="50" cy="50" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="550" cy="400" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Illustration Box -->
  <g transform="translate(300, 210)">
    
        <!-- Desert dunes -->
        <ellipse cx="-70" cy="110" rx="180" ry="40" fill="#d97706"/>
        <ellipse cx="90" cy="115" rx="190" ry="40" fill="#b45309"/>

        <!-- Tent -->
        <polygon points="-80,100 -20,20 40,100" fill="#fef3c7" stroke="#78350f" stroke-width="4"/>
        <polygon points="-20,20 40,100 65,100 10,20" fill="#fde047" stroke="#78350f" stroke-width="4"/>
        <!-- Tent entrance -->
        <polygon points="-20,60 -5,100 -35,100" fill="#451a03"/>

        <!-- Starry Heavens with large glowing stars -->
        <circle cx="-130" cy="-90" r="5" fill="#ffffff" filter="url(#shadow)"/>
        <circle cx="-60" cy="-140" r="7" fill="#fef08a"/>
        <circle cx="20" cy="-100" r="8" fill="#ffffff"/>
        <circle cx="90" cy="-130" r="6" fill="#fef08a"/>
        <circle cx="150" cy="-70" r="7" fill="#ffffff"/>
        <circle cx="-30" cy="-70" r="4" fill="#ffffff"/>
        <circle cx="120" cy="-30" r="4" fill="#ffffff"/>
        <circle cx="-110" cy="-30" r="5" fill="#fef08a"/>
        
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 395)" filter="url(#shadow)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#ffffff" opacity="0.96"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e1b4b">
      Las Estrellas y la Promesa a Abraham
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="David, serif" font-weight="bold" font-size="18" fill="#7c3aed">
      לֶךְ־לְךָ
    </text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(45, 45)">
    <rect width="130" height="36" rx="18" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <text x="65" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4338ca">
      ⭐ Semillas
    </text>
  </g>
</svg>