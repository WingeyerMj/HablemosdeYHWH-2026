<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" rx="28" fill="url(#bg)"/>
  
  <!-- Subtle Pattern Circles -->
  <circle cx="50" cy="50" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="550" cy="400" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Illustration Box -->
  <g transform="translate(300, 210)">
    
        <!-- Sound Waves -->
        <path d="M 80 -60 Q 150 -100 210 -70" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
        <path d="M 100 -40 Q 170 -70 230 -40" fill="none" stroke="#fde047" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
        <path d="M 120 -20 Q 190 -40 250 -10" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>

        <!-- Musical notes -->
        <text x="180" y="-110" font-size="34" fill="#fef08a">🎵</text>
        <text x="210" y="-40" font-size="28" fill="#fde047">🎶</text>

        <!-- Shofar Horn -->
        <path d="M -160 80 Q -100 110 -20 70 Q 60 40 100 -30 Q 110 -50 80 -45 Q 40 20 -30 45 Q -100 70 -140 50 Z" 
              fill="#fef3c7" stroke="#92400e" stroke-width="8" stroke-linejoin="round"/>
        <!-- Horn bands/texture -->
        <path d="M -60 70 Q -30 35 -10 52" stroke="#d97706" stroke-width="5" fill="none"/>
        <path d="M 0 52 Q 30 15 50 32" stroke="#d97706" stroke-width="5" fill="none"/>
        <path d="M 50 22 Q 70 -10 85 5" stroke="#d97706" stroke-width="5" fill="none"/>
        
        <!-- Wool ribbon -->
        <path d="M -90 85 Q -80 130 -110 140" stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M -80 85 Q -70 125 -60 145" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/>
        
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 395)" filter="url(#shadow)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#ffffff" opacity="0.96"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e1b4b">
      Shofar Artesanal de Cartón
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="David, serif" font-weight="bold" font-size="18" fill="#7c3aed">
      יוֹם תְּרוּעָה
    </text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(45, 45)">
    <rect width="130" height="36" rx="18" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <text x="65" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4338ca">
      🎺 Semillas
    </text>
  </g>
</svg>