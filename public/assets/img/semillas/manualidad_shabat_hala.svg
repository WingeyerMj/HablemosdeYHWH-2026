<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/><stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" rx="28" fill="url(#bg)"/>
  
  <!-- Subtle Pattern Circles -->
  <circle cx="50" cy="50" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="550" cy="400" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Illustration Box -->
  <g transform="translate(300, 210)">
    
        <!-- Shabbat Tablecloth -->
        <ellipse cx="0" cy="70" rx="160" ry="45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>

        <!-- Challah Braided Loaf -->
        <ellipse cx="40" cy="70" rx="60" ry="24" fill="#d97706"/>
        <ellipse cx="20" cy="65" rx="20" ry="16" fill="#b45309"/>
        <ellipse cx="45" cy="65" rx="20" ry="16" fill="#f59e0b"/>
        <ellipse cx="70" cy="65" rx="20" ry="16" fill="#b45309"/>

        <!-- Kiddush Cup -->
        <path d="M -90 40 L -60 40 L -65 70 L -85 70 Z" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
        <rect x="-78" y="70" width="6" height="20" fill="#6366f1"/>
        <ellipse cx="-75" cy="90" rx="22" ry="6" fill="#6366f1"/>

        <!-- Two Shabbat Candles -->
        <!-- Candlestick 1 -->
        <rect x="-30" y="-30" width="12" height="70" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <ellipse cx="-24" cy="-30" rx="6" ry="2" fill="#cbd5e1"/>
        <!-- Flame 1 -->
        <path d="M -24 -60 C -16 -46 -18 -34 -24 -30 C -30 -34 -32 -46 -24 -60 Z" fill="#f59e0b"/>
        <path d="M -24 -52 C -20 -44 -20 -36 -24 -32 C -28 -36 -28 -44 -24 -52 Z" fill="#fef08a"/>

        <!-- Candlestick 2 -->
        <rect x="0" y="-30" width="12" height="70" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
        <ellipse cx="6" cy="-30" rx="6" ry="2" fill="#cbd5e1"/>
        <!-- Flame 2 -->
        <path d="M 6 -60 C 14 -46 12 -34 6 -30 C 0 -34 -2 -46 6 -60 Z" fill="#f59e0b"/>
        <path d="M 6 -52 C 10 -44 10 -36 6 -32 C 2 -36 2 -44 6 -52 Z" fill="#fef08a"/>
        
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 395)" filter="url(#shadow)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#ffffff" opacity="0.96"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e1b4b">
      Mantelito para Jalá y Velitas
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="David, serif" font-weight="bold" font-size="18" fill="#7c3aed">
      שַׁבָּת שָׁלוֹם
    </text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(45, 45)">
    <rect width="130" height="36" rx="18" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <text x="65" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#4338ca">
      🕯️ Semillas
    </text>
  </g>
</svg>